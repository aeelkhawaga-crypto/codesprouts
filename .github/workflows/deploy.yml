name: Deploy site to GitHub Pages

# Builds the Next.js static export and publishes it to the `gh-pages` branch,
# which GitHub Pages serves at codesprouts.ie. Runs on every push to the
# active source branch, plus a manual trigger.
on:
  push:
    branches: [ralph/static-website-redesign]
  workflow_dispatch:

# Allow the workflow to push the built output to the gh-pages branch.
permissions:
  contents: write

# Avoid overlapping deploys.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # Preserve the custom domain on every deploy.
          cname: codesprouts.ie
